<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마감지기 - 우리 반 수행평가 달력</title>
<style>
  /* ===== 기본 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif;
    background: #f1f4f8; color: #1f2933; padding-bottom: 40px;
  }
  button { font-family: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  /* ===== 상단 ===== */
  header {
    background: #1a365d; color: #fff; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  header h1 { font-size: 1.35rem; }
  header p { font-size: 0.8rem; opacity: 0.8; margin-top: 2px; }
  .badge { background: #f6ad55; color: #1f2933; font-size: 0.7rem; padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }
  .btn { border: none; border-radius: 8px; padding: 9px 14px; font-size: 0.9rem; }
  .btn.primary { background: #1a365d; color: #fff; }
  .btn.ghost { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.4); }
  .btn.light { background: #e2e8f0; color: #1f2933; }
  .btn.danger { background: #fed7d7; color: #9b2c2c; }
  .btn.ok { background: #c6f6d5; color: #22543d; }
  .btn.small { padding: 4px 9px; font-size: 0.75rem; }

  /* ===== 관리자 바 ===== */
  #adminBar {
    background: #fefcbf; border-bottom: 1px solid #ecc94b; padding: 9px 24px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.88rem;
  }
  #adminBar .spacer { flex: 1; }

  main { max-width: 1320px; margin: 0 auto; padding: 16px; }

  /* ===== 학년/반 선택 ===== */
  #picker { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; }
  .tabs { display: flex; gap: 6px; }
  .tab {
    border: 1px solid #cbd5e0; background: #fff; color: #1f2933;
    padding: 8px 16px; border-radius: 999px; font-size: 0.92rem;
  }
  .tab.active { background: #1a365d; color: #fff; border-color: #1a365d; font-weight: bold; }
  #boardName { font-size: 1.05rem; font-weight: bold; margin-left: auto; }

  /* ===== 2단 배치 (넓은 화면: 달력 + 목록) ===== */
  #layout { display: flex; gap: 16px; align-items: flex-start; }
  #calCard { flex: 2.2; min-width: 0; }
  #sideCol { flex: 1; min-width: 0; }
  @media (max-width: 860px) { #layout { flex-direction: column; } #calCard, #sideCol { width: 100%; } }
  .card { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

  /* ===== 달력 ===== */
  #calNav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; }
  #calTitle { font-size: 1.15rem; font-weight: bold; min-width: 130px; text-align: center; }
  .navBtn { border: none; background: #e2e8f0; width: 32px; height: 32px; border-radius: 50%; font-size: 1rem; }
  #weekdays, #calGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  #weekdays div { text-align: center; font-size: 0.78rem; color: #52606d; padding: 4px 0; font-weight: bold; }
  #weekdays div:first-child { color: #e53e3e; }
  #weekdays div:last-child { color: #3182ce; }
  .cell {
    min-height: 88px; background: #f8fafc; border-radius: 8px; padding: 5px;
    cursor: pointer; border: 2px solid transparent; overflow: hidden;
  }
  .cell:hover { border-color: #a0aec0; }
  .cell.blank { background: transparent; cursor: default; border: none; }
  .cell.today { border-color: #1a365d; background: #ebf4ff; }
  .cell.past { opacity: 0.55; }
  .cell .num { font-size: 0.8rem; font-weight: bold; display: block; margin-bottom: 3px; }
  .chip {
    display: block; color: #fff; font-size: 0.7rem; border-radius: 5px;
    padding: 2px 5px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 학생이 올리고 아직 선생님이 확인하지 않은 일정: 점선 테두리로 구분 */
  .chip.unverified { opacity: 0.75; outline: 2px dashed #1f2933; outline-offset: -2px; }
  .more { font-size: 0.68rem; color: #52606d; }
  #legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; font-size: 0.72rem; color: #52606d; min-height: 1em; }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 3px; }
  #legend button { border: none; background: none; color: #c53030; font-size: 0.8rem; margin-left: 2px; }

  /* ===== 통계 + 다가오는 목록 ===== */
  #stats { display: flex; gap: 8px; margin-bottom: 12px; }
  .stat { flex: 1; background: #fff; border-radius: 12px; padding: 10px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .stat b { font-size: 1.35rem; display: block; }
  .stat span { font-size: 0.72rem; color: #52606d; }
  h2 { font-size: 0.98rem; margin-bottom: 10px; }
  .row {
    display: flex; align-items: center; gap: 10px; padding: 9px 4px;
    border-bottom: 1px solid #edf2f7; border-left: 5px solid #ccc; padding-left: 10px; margin-bottom: 4px;
  }
  .row .info { flex: 1; min-width: 0; }
  .row .title { font-weight: bold; font-size: 0.9rem; }
  .row .meta { font-size: 0.76rem; color: #52606d; margin-top: 2px; }
  .tag { display: inline-block; background: #feebc8; color: #9c4221; font-size: 0.66rem; font-weight: normal; border-radius: 999px; padding: 1px 7px; margin-left: 4px; vertical-align: middle; }
  .dday { font-weight: bold; font-size: 0.88rem; min-width: 52px; text-align: right; }
  .dday.urgent { color: #e53e3e; } .dday.soon { color: #dd6b20; } .dday.safe { color: #38a169; } .dday.over { color: #718096; }
  .empty { text-align: center; color: #9aa5b1; font-size: 0.85rem; padding: 22px 0; }
  .adminBtns { margin-top: 5px; display: flex; gap: 5px; }

  /* ===== 모달(팝업 창) ===== */
  .modal {
    position: fixed; inset: 0; background: rgba(15,23,42,0.5);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal .box { background: #fff; border-radius: 14px; padding: 20px; width: 100%; max-width: 440px; max-height: 92vh; overflow: auto; }
  .modal h3 { font-size: 1.05rem; margin-bottom: 14px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 0.8rem; color: #52606d; margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 0.92rem; font-family: inherit;
  }
  .two { display: flex; gap: 8px; } .two .field { flex: 1; }
  .subjRow { display: flex; gap: 6px; align-items: center; }
  .subjRow select, .subjRow input { flex: 1; }
  .subjRow .btn { white-space: nowrap; padding: 9px 11px; font-size: 0.82rem; }
  #targetBox { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 8px; font-size: 0.8rem; }
  #targetBox label { display: flex; align-items: center; gap: 4px; color: #1f2933; margin: 0; }
  #targetBox input { width: auto; }
  #studentNote { font-size: 0.78rem; color: #9c4221; background: #fffaf0; border-radius: 8px; padding: 8px 10px; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .error { color: #c53030; font-size: 0.8rem; margin-top: 6px; min-height: 1em; }
</style>
</head>
<body>

<header>
  <div>
    <h1>⏰ 마감지기 <span class="badge" id="demoBadge" hidden>데모 모드</span></h1>
    <p>우리 반 수행평가, 달력으로 한눈에</p>
  </div>
  <button class="btn ghost" id="loginBtn">선생님 로그인</button>
</header>

<!-- 관리자(선생님)로 로그인했을 때만 보이는 바 -->
<div id="adminBar" hidden>
  <b>🔧 관리자 모드</b>
  <span>학생이 올린 일정을 확인하고, 모든 일정을 수정·삭제할 수 있습니다.</span>
  <span class="spacer"></span>
  <button class="btn light" id="sampleBtn">예시 데이터 채우기</button>
  <button class="btn light" id="logoutBtn">로그아웃</button>
</div>

<main>
  <!-- 학년/반 선택 -->
  <div id="picker">
    <div class="tabs" id="gradeTabs"></div>
    <div class="tabs" id="classTabs"></div>
    <div id="boardName"></div>
    <button class="btn primary" id="addBtn">+ 수행평가 추가</button>
  </div>

  <div id="layout">
    <!-- 달력 -->
    <section class="card" id="calCard">
      <div id="calNav">
        <button class="navBtn" id="prevBtn">‹</button>
        <div id="calTitle"></div>
        <button class="navBtn" id="nextBtn">›</button>
      </div>
      <div id="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
      <div id="calGrid"></div>
      <div id="legend"></div>
    </section>

    <!-- 통계 + 다가오는 수행평가 -->
    <div id="sideCol">
      <div id="stats">
        <div class="stat"><b id="stMonth">0</b><span>이번 달</span></div>
        <div class="stat"><b id="stUrgent">0</b><span>D-3 이내</span></div>
        <div class="stat"><b id="stNext">-</b><span>가장 가까운 마감</span></div>
      </div>
      <section class="card">
        <h2>📌 다가오는 수행평가 (마감 임박순)</h2>
        <div id="upList"></div>
      </section>
    </div>
  </div>
</main>

<!-- 로그인 창 -->
<div class="modal" id="loginModal" hidden>
  <div class="box">
    <h3>🔐 선생님 로그인</h3>
    <div class="field" id="emailField" hidden>
      <label>이메일</label>
      <input type="email" id="loginEmail" placeholder="teacher@school.kr">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="loginPw" placeholder="비밀번호 입력">
    </div>
    <div class="error" id="loginError"></div>
    <div class="actions">
      <button class="btn light" data-close>취소</button>
      <button class="btn primary" id="loginSubmit">로그인</button>
    </div>
  </div>
</div>

<!-- 수행평가 추가/수정 창 -->
<div class="modal" id="taskModal" hidden>
  <div class="box">
    <h3 id="taskModalTitle">📝 수행평가 추가</h3>
    <div class="field">
      <label>과목 *</label>
      <div class="subjRow">
        <select id="fSubject"></select>
        <button class="btn light" id="subjToggle" type="button">+ 과목 추가</button>
      </div>
    </div>
    <!-- '+ 과목 추가'를 누르면 나타나는 입력칸 -->
    <div class="field" id="newSubjRow" hidden>
      <div class="subjRow">
        <input type="text" id="newSubj" maxlength="12" placeholder="새 과목 이름 (예: 미적분, 대수)">
        <button class="btn primary" id="newSubjAdd" type="button">추가</button>
      </div>
    </div>
    <div class="two">
      <div class="field"><label>마감 날짜 *</label><input type="date" id="fDate"></div>
      <div class="field"><label>마감 시각</label><input type="time" id="fTime" value="23:59"></div>
    </div>
    <div class="field"><label>수행평가 이름 *</label><input type="text" id="fTitle" maxlength="40" placeholder="예: 전자기 유도 탐구 보고서"></div>
    <div class="field"><label>안내 사항 (선택)</label><textarea id="fDesc" rows="2" maxlength="120" placeholder="제출 방법, 준비물 등"></textarea></div>
    <!-- 선생님: 여러 반 동시 등록 -->
    <div class="field" id="targetField">
      <label>등록할 반 * (여러 반 동시 선택 가능)</label>
      <div id="targetBox"></div>
    </div>
    <!-- 학생: 지금 보고 있는 반에만 등록 -->
    <div id="studentNote" hidden></div>
    <div class="error" id="taskError"></div>
    <div class="actions">
      <button class="btn light" data-close>취소</button>
      <button class="btn primary" id="taskSubmit">저장</button>
    </div>
  </div>
</div>

<!-- 날짜를 눌렀을 때 뜨는 상세 창 -->
<div class="modal" id="dayModal" hidden>
  <div class="box">
    <h3 id="dayTitle"></h3>
    <div id="dayList"></div>
    <div class="actions">
      <button class="btn primary" id="dayAddBtn">+ 이 날짜에 추가</button>
      <button class="btn light" data-close>닫기</button>
    </div>
  </div>
</div>

<script>
/* ==========================================================
   마감지기 - 학년·반별 수행평가 달력 보드
   작성: 박대선 (2026 교내 SW 경시대회 출품작)

   전체 구조
   [1] 설정      : Firebase 설정값, 학년/반 구성, 과목 색상 팔레트
   [2] 상태      : 수행평가 목록, 과목 목록, 로그인 여부, 현재 반/달
   [3] 저장소    : 데모 모드(localStorage) / Firebase 모드(Firestore)
   [4] 로그인    : 선생님 = 관리자 (확인·수정·삭제 가능)
   [5] 화면 그리기: 달력, 통계, 다가오는 목록
   [6] 창(모달)  : 로그인 / 추가·수정 / 날짜 상세

   누가 무엇을 할 수 있나
   - 학생  : 자기 반 보드에 수행평가 추가, 과목 추가 → '학생 등록' 표시가 붙음
   - 선생님: 학생이 올린 일정 확인(승인), 모든 일정 수정·삭제, 여러 반 동시 등록
   ========================================================== */

// ----- [1] 설정 -----
// Firebase 콘솔에서 받은 값을 붙여넣으면 '모든 기기가 같은 보드를 보는' 실서비스 모드가 됨
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
};
// 설정값이 아직 비어 있으면 데모 모드: 데이터가 이 기기(브라우저)에만 저장됨
const isDemo = firebaseConfig.apiKey.startsWith("YOUR");

// 데모 모드 전용 선생님 비밀번호 (시연용).
// 주의: 이 값은 소스코드에 그대로 보이므로 실제 운영에서는 쓰면 안 됨.
//       실제 운영은 Firebase 로그인(서버가 비밀번호 확인)을 사용함.
const DEMO_TEACHER_PW = "teacher2026";

const GRADES = [1, 2, 3];
const CLASSES = [1, 2, 3, 4];
// 과목은 정해 두지 않고 사용자가 추가함. 추가할 때 아래 색을 순서대로 하나씩 배정
const PALETTE = ["#e53e3e", "#3182ce", "#805ad5", "#dd6b20", "#38a169", "#319795",
                 "#b7791f", "#d53f8c", "#2d3748", "#718096", "#00a3c4", "#975a16"];
const NO_COLOR = "#4a5568";   // 삭제된 과목 등 색을 찾지 못했을 때 쓰는 회색

// ----- [2] 상태 -----
let tasks = [];               // 전체 수행평가 목록 (모든 반)
let subjects = [];            // 과목 목록: { id, name, color }
let isAdmin = false;          // 선생님 로그인 여부
let editingId = null;         // 수정 중인 수행평가 id (새로 추가면 null)
let fb = null;                // Firebase 관련 객체 모음 (실서비스 모드에서만 사용)
const now0 = new Date();
let cur = {                   // 현재 보고 있는 반 (마지막 선택을 기억)
  grade: Number(localStorage.getItem("mg_grade")) || 1,
  cls: Number(localStorage.getItem("mg_cls")) || 1,
};
let view = { y: now0.getFullYear(), m: now0.getMonth() }; // 현재 보고 있는 달

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const newId = () => "x" + Date.now() + Math.random().toString(36).slice(2, 7);

// ----- [3] 저장소 -----
// 추가/수정/삭제를 함수로 묶어서, 데모 모드든 Firebase 모드든 같은 방식으로 호출
async function addTask(task) {
  if (isDemo) { task.id = newId(); tasks.push(task); saveLocal(); }
  else await fb.fs.addDoc(fb.fs.collection(fb.db, "tasks"), task);
}
async function updateTask(id, data) {
  if (isDemo) { Object.assign(tasks.find(t => t.id === id), data); saveLocal(); }
  else await fb.fs.updateDoc(fb.fs.doc(fb.db, "tasks", id), data);
}
async function deleteTask(id) {
  if (isDemo) { tasks = tasks.filter(t => t.id !== id); saveLocal(); }
  else await fb.fs.deleteDoc(fb.fs.doc(fb.db, "tasks", id));
}
// 과목 추가: 이미 있는 이름이면 새로 만들지 않음
async function addSubject(name) {
  if (subjects.some(s => s.name === name)) return;
  // 아직 안 쓴 색을 먼저 배정하고, 다 썼으면 처음부터 다시 돌려 씀
  const unused = PALETTE.find(c => !subjects.some(s => s.color === c));
  const subject = { name, color: unused || PALETTE[subjects.length % PALETTE.length] };
  if (isDemo) { subject.id = newId(); subjects.push(subject); saveLocal(); }
  else await fb.fs.addDoc(fb.fs.collection(fb.db, "subjects"), subject);
}
async function deleteSubject(id) {
  if (isDemo) { subjects = subjects.filter(s => s.id !== id); saveLocal(); }
  else await fb.fs.deleteDoc(fb.fs.doc(fb.db, "subjects", id));
}
function saveLocal() {
  // localStorage는 문자열만 저장할 수 있어서 JSON 문자열로 바꿔 저장
  localStorage.setItem("mg_tasks", JSON.stringify(tasks));
  localStorage.setItem("mg_subjects", JSON.stringify(subjects));
}
// 과목 이름으로 색 찾기
function colorOf(name) {
  const s = subjects.find(s => s.name === name);
  return s ? s.color : NO_COLOR;
}

// 앱 시작: 데이터를 불러오고 화면을 처음 그림
async function init() {
  if (isDemo) {
    $("demoBadge").hidden = false;
    tasks = JSON.parse(localStorage.getItem("mg_tasks") || "[]");
    subjects = JSON.parse(localStorage.getItem("mg_subjects") || "[]");
  } else {
    $("emailField").hidden = false;
    $("sampleBtn").hidden = true;
    const appMod = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const fs = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const au = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
    const app = appMod.initializeApp(firebaseConfig);
    fb = { fs, au, db: fs.getFirestore(app), auth: au.getAuth(app) };
    // 실시간 구독: 누가 추가하든 모든 화면에 바로 반영
    fs.onSnapshot(fs.collection(fb.db, "tasks"), (snap) => {
      tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderAll();
    });
    fs.onSnapshot(fs.collection(fb.db, "subjects"), (snap) => {
      subjects = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderAll(); fillSubjectSelect($("fSubject").value);
    });
    // 로그인 상태가 바뀔 때마다 관리자 모드 켜고 끄기
    au.onAuthStateChanged(fb.auth, (user) => { isAdmin = !!user; renderAll(); });
  }
  renderAll();
}

// ----- [4] 로그인 / 로그아웃 -----
async function login() {
  const pw = $("loginPw").value;
  $("loginError").textContent = "";
  if (isDemo) {
    if (pw !== DEMO_TEACHER_PW) { $("loginError").textContent = "비밀번호가 올바르지 않습니다."; return; }
    isAdmin = true;
  } else {
    try {
      await fb.au.signInWithEmailAndPassword(fb.auth, $("loginEmail").value, pw);
    } catch (e) {
      $("loginError").textContent = "로그인 실패: 이메일 또는 비밀번호를 확인하세요."; return;
    }
  }
  $("loginPw").value = "";
  closeModals();
  renderAll();
}
async function logout() {
  if (isDemo) isAdmin = false; else await fb.au.signOut(fb.auth);
  renderAll();
}

// ----- [5] 화면 그리기 -----
// 현재 선택한 반의 수행평가만 골라냄
function classTasks() {
  return tasks.filter(t => t.grade === cur.grade && t.cls === cur.cls);
}
// 마감 시각을 숫자(밀리초)로 변환 → 크기 비교/정렬에 사용
function deadlineMs(t) {
  return new Date(t.date + "T" + (t.time || "23:59")).getTime();
}
// D-day 계산: '날짜' 기준으로 며칠 남았는지 계산 (시각 차이로 계산하면 하루씩 어긋날 수 있음)
function getDday(t) {
  if (deadlineMs(t) < Date.now()) return { label: "마감", level: "over" };
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const due = new Date(t.date + "T00:00");
  const days = Math.round((due - today) / 86400000);
  if (days === 0) return { label: "D-DAY", level: "urgent" };
  if (days <= 3) return { label: "D-" + days, level: "urgent" };
  if (days <= 7) return { label: "D-" + days, level: "soon" };
  return { label: "D-" + days, level: "safe" };
}
function fmtDate(t) {
  const d = new Date(t.date + "T00:00");
  return `${d.getMonth() + 1}/${d.getDate()}(${"일월화수목금토"[d.getDay()]}) ${t.time || "23:59"}`;
}
// 입력값이 HTML 코드로 해석되지 않도록 특수문자를 치환 (보안)
function esc(s) {
  return String(s || "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// 학생이 올렸고 아직 선생님이 확인하지 않은 일정인지
const isUnverified = (t) => t.verified === false;

function renderAll() {
  renderHeader(); renderPicker(); renderCalendar(); renderSide();
}

function renderHeader() {
  $("adminBar").hidden = !isAdmin;
  $("loginBtn").hidden = isAdmin;
}

function renderPicker() {
  $("gradeTabs").innerHTML = GRADES.map(g =>
    `<button class="tab ${g === cur.grade ? "active" : ""}" data-grade="${g}">${g}학년</button>`).join("");
  $("classTabs").innerHTML = CLASSES.map(c =>
    `<button class="tab ${c === cur.cls ? "active" : ""}" data-cls="${c}">${c}반</button>`).join("");
  $("boardName").textContent = `${cur.grade}학년 ${cur.cls}반 보드`;
}

function renderCalendar() {
  const { y, m } = view;
  $("calTitle").textContent = `${y}년 ${m + 1}월`;
  const firstDay = new Date(y, m, 1).getDay();        // 1일의 요일 (0=일요일)
  const lastDate = new Date(y, m + 1, 0).getDate();   // 그 달의 마지막 날짜
  const todayStr = ymd(new Date());
  const list = classTasks();

  let html = "";
  // 1일 앞의 빈칸
  for (let i = 0; i < firstDay; i++) html += `<div class="cell blank"></div>`;
  // 날짜 칸
  for (let d = 1; d <= lastDate; d++) {
    const ds = `${y}-${pad(m + 1)}-${pad(d)}`;
    const dayTasks = list.filter(t => t.date === ds).sort((a, b) => deadlineMs(a) - deadlineMs(b));
    const chips = dayTasks.slice(0, 3).map(t =>
      `<span class="chip${isUnverified(t) ? " unverified" : ""}" style="background:${colorOf(t.subject)}" title="${esc(t.subject)}">${esc(t.title)}</span>`).join("");
    const more = dayTasks.length > 3 ? `<span class="more">+${dayTasks.length - 3}개 더</span>` : "";
    const cls = (ds === todayStr ? " today" : "") + (ds < todayStr ? " past" : "");
    html += `<div class="cell${cls}" data-date="${ds}"><span class="num">${d}</span>${chips}${more}</div>`;
  }
  $("calGrid").innerHTML = html;

  // 색상 안내: 관리자 모드에서는 전체 과목(+삭제 버튼), 학생 화면에서는 이 반에서 쓰는 과목만
  const used = new Set(list.map(t => t.subject));
  const shown = isAdmin ? subjects : subjects.filter(s => used.has(s.name));
  $("legend").innerHTML = shown.map(s =>
    `<span><i style="background:${s.color}"></i>${esc(s.name)}${isAdmin ? `<button data-delsubj="${s.id}" title="과목 삭제">✕</button>` : ""}</span>`).join("");
}

function renderSide() {
  const list = classTasks();
  const upcoming = list.filter(t => deadlineMs(t) >= Date.now()).sort((a, b) => deadlineMs(a) - deadlineMs(b));
  const thisMonth = `${now0.getFullYear()}-${pad(now0.getMonth() + 1)}`;

  $("stMonth").textContent = list.filter(t => t.date.startsWith(thisMonth)).length;
  $("stUrgent").textContent = upcoming.filter(t => getDday(t).level === "urgent").length;
  $("stNext").textContent = upcoming.length ? getDday(upcoming[0]).label : "-";

  $("upList").innerHTML = upcoming.length
    ? upcoming.map(rowHtml).join("")
    : `<div class="empty">다가오는 수행평가가 없습니다 🎉</div>`;
}

// 수행평가 한 줄(목록용) HTML 만들기
function rowHtml(t) {
  const dd = getDday(t);
  const tag = isUnverified(t) ? `<span class="tag">학생 등록 · 확인 전</span>` : "";
  // 수정·삭제·확인 버튼은 선생님(관리자)에게만 보임
  const admin = isAdmin
    ? `<div class="adminBtns">
        ${isUnverified(t) ? `<button class="btn ok small" data-verify="${t.id}">확인</button>` : ""}
        <button class="btn light small" data-edit="${t.id}">수정</button>
        <button class="btn danger small" data-del="${t.id}">삭제</button>
      </div>` : "";
  return `<div class="row" style="border-left-color:${colorOf(t.subject)}">
      <div class="info">
        <div class="title">[${esc(t.subject)}] ${esc(t.title)}${tag}</div>
        <div class="meta">⏰ ${fmtDate(t)}${t.desc ? " · " + esc(t.desc) : ""}</div>
        ${admin}
      </div>
      <div class="dday ${dd.level}">${dd.label}</div>
    </div>`;
}

// ----- [6] 창(모달) -----
function closeModals() {
  document.querySelectorAll(".modal").forEach(m => m.hidden = true);
  $("dayList").innerHTML = ""; // 닫을 때 내용을 비움 (로그아웃 뒤 수정·삭제 버튼이 남지 않게)
}

// 과목 선택 목록 채우기. selected가 있으면 그 과목을 선택해 둠
function fillSubjectSelect(selected) {
  $("fSubject").innerHTML = subjects.length
    ? subjects.map(s => `<option>${esc(s.name)}</option>`).join("")
    : `<option value="">과목을 먼저 추가하세요</option>`;
  if (selected && subjects.some(s => s.name === selected)) $("fSubject").value = selected;
}

// '+ 과목 추가' 입력칸에서 추가 버튼을 눌렀을 때
async function submitNewSubject() {
  const name = $("newSubj").value.trim();
  if (!name) return;
  await addSubject(name);
  fillSubjectSelect(name);       // 방금 추가한 과목을 바로 선택
  $("newSubj").value = "";
  $("newSubjRow").hidden = true;
  renderCalendar();
}

// 추가/수정 창 열기. task가 있으면 수정, 없으면 새로 추가
function openTaskModal(task, presetDate) {
  editingId = task ? task.id : null;
  $("taskModalTitle").textContent = task ? "✏️ 수행평가 수정" : "📝 수행평가 추가";
  fillSubjectSelect(task ? task.subject : null);
  $("newSubjRow").hidden = true;
  $("fDate").value = task ? task.date : (presetDate || "");
  $("fTime").value = task ? (task.time || "23:59") : "23:59";
  $("fTitle").value = task ? task.title : "";
  $("fDesc").value = task ? (task.desc || "") : "";
  $("taskError").textContent = "";
  // 선생님이 새로 추가할 때만 '여러 반 동시 등록' 체크박스 표시 (기본: 현재 보고 있는 반)
  $("targetField").hidden = !isAdmin || !!task;
  $("targetBox").innerHTML = GRADES.map(g => CLASSES.map(c =>
    `<label><input type="checkbox" value="${g}-${c}" ${g === cur.grade && c === cur.cls ? "checked" : ""}>${g}-${c}</label>`
  ).join("")).join("");
  // 학생이 추가할 때는 현재 반에만 등록되고 '학생 등록' 표시가 붙는다고 안내
  $("studentNote").hidden = isAdmin;
  $("studentNote").textContent = `${cur.grade}학년 ${cur.cls}반 보드에 '학생 등록'으로 올라가며, 선생님이 확인하면 표시가 사라집니다.`;
  closeModals();
  $("taskModal").hidden = false;
}

async function submitTask() {
  const data = {
    subject: $("fSubject").value,
    date: $("fDate").value,
    time: $("fTime").value || "23:59",
    title: $("fTitle").value.trim(),
    desc: $("fDesc").value.trim(),
  };
  if (!data.subject) { $("taskError").textContent = "'+ 과목 추가'로 과목을 먼저 만들어 주세요."; return; }
  if (!data.date || !data.title) { $("taskError").textContent = "마감 날짜와 수행평가 이름을 입력하세요."; return; }

  if (editingId) {
    await updateTask(editingId, data);
  } else if (isAdmin) {
    // 선생님: 체크한 반마다 하나씩 등록 → 같은 수행평가를 여러 반에 한 번에 올림
    const targets = [...document.querySelectorAll("#targetBox input:checked")].map(i => i.value);
    if (!targets.length) { $("taskError").textContent = "등록할 반을 하나 이상 선택하세요."; return; }
    for (const v of targets) {
      const [g, c] = v.split("-").map(Number);
      await addTask({ ...data, grade: g, cls: c, by: "teacher", verified: true, createdAt: Date.now() });
    }
  } else {
    // 학생: 지금 보고 있는 반에만, '확인 전' 상태로 등록
    await addTask({ ...data, grade: cur.grade, cls: cur.cls, by: "student", verified: false, createdAt: Date.now() });
  }
  // 등록한 날짜가 있는 달로 달력을 이동
  const d = new Date(data.date + "T00:00");
  view = { y: d.getFullYear(), m: d.getMonth() };
  closeModals();
  renderAll();
}

// 날짜 칸을 눌렀을 때: 그 날의 수행평가 상세 보기
function openDay(ds) {
  const d = new Date(ds + "T00:00");
  $("dayTitle").textContent = `📅 ${d.getMonth() + 1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]}) · ${cur.grade}학년 ${cur.cls}반`;
  const dayTasks = classTasks().filter(t => t.date === ds).sort((a, b) => deadlineMs(a) - deadlineMs(b));
  $("dayList").innerHTML = dayTasks.length
    ? dayTasks.map(rowHtml).join("")
    : `<div class="empty">이 날 마감인 수행평가가 없습니다.</div>`;
  $("dayAddBtn").dataset.date = ds;
  $("dayModal").hidden = false;
}

// 예시 데이터 채우기 (데모 모드 전용, 가상 데이터)
async function fillSample() {
  if (!confirm("모든 반에 예시 수행평가를 채울까요? (가상 데이터)")) return;
  const samples = [   // [과목, 이름, 오늘로부터 며칠 뒤(음수면 지난 날짜), 학생이 올린 것인지]
    ["영어", "단어 시험", -11], ["대수", "서술형 평가", -6], ["체육", "실기 평가", -3],
    ["국어", "독서 감상문 제출", 2], ["영어", "에세이 쓰기", 4], ["대수", "탐구 보고서", 7],
    ["물리", "실험 보고서", 9], ["화학", "단원 발표", 12], ["정보", "프로젝트 결과물", 15],
    ["국어", "모둠 발표 자료 제출", 17, true],
  ];
  for (const [subject] of samples) await addSubject(subject);
  for (const g of GRADES) for (const c of CLASSES) {
    for (const [subject, title, offset, byStudent] of samples) {
      const d = new Date(); d.setDate(d.getDate() + offset + ((g + c) % 3));
      await addTask({ subject, title, desc: "", date: ymd(d), time: "23:59", grade: g, cls: c,
                      by: byStudent ? "student" : "teacher", verified: !byStudent, createdAt: Date.now() });
    }
  }
  renderAll();
}

// ----- 버튼/클릭 연결 -----
$("loginBtn").onclick = () => { $("loginError").textContent = ""; $("loginModal").hidden = false; $("loginPw").focus(); };
$("loginSubmit").onclick = login;
$("loginPw").onkeydown = (e) => { if (e.key === "Enter") login(); };
$("logoutBtn").onclick = logout;
$("addBtn").onclick = () => openTaskModal(null);
$("sampleBtn").onclick = fillSample;
$("taskSubmit").onclick = submitTask;
$("subjToggle").onclick = () => { $("newSubjRow").hidden = !$("newSubjRow").hidden; $("newSubj").focus(); };
$("newSubjAdd").onclick = submitNewSubject;
$("newSubj").onkeydown = (e) => { if (e.key === "Enter") submitNewSubject(); };
$("dayAddBtn").onclick = () => openTaskModal(null, $("dayAddBtn").dataset.date);
$("prevBtn").onclick = () => { view.m--; if (view.m < 0) { view.m = 11; view.y--; } renderCalendar(); };
$("nextBtn").onclick = () => { view.m++; if (view.m > 11) { view.m = 0; view.y++; } renderCalendar(); };

// 화면 어디를 누르든 여기서 한 번에 처리 (이벤트 위임)
document.addEventListener("click", async (e) => {
  const el = e.target;
  if (el.dataset.grade) { cur.grade = Number(el.dataset.grade); localStorage.setItem("mg_grade", cur.grade); renderAll(); }
  else if (el.dataset.cls) { cur.cls = Number(el.dataset.cls); localStorage.setItem("mg_cls", cur.cls); renderAll(); }
  else if (el.dataset.verify) { await updateTask(el.dataset.verify, { verified: true }); closeModals(); renderAll(); }
  else if (el.dataset.edit) { openTaskModal(tasks.find(t => t.id === el.dataset.edit)); }
  else if (el.dataset.del) {
    if (confirm("이 수행평가를 삭제할까요?")) { await deleteTask(el.dataset.del); closeModals(); renderAll(); }
  }
  else if (el.dataset.delsubj) {
    if (confirm("이 과목을 삭제할까요? (이미 등록된 수행평가는 남고 색만 회색이 됩니다)")) { await deleteSubject(el.dataset.delsubj); renderAll(); }
  }
  else if (el.hasAttribute("data-close") || el.classList.contains("modal")) { closeModals(); }
  else {
    const cell = el.closest(".cell[data-date]");
    if (cell) openDay(cell.dataset.date);
  }
});

init();
</script>
</body>
</html>
